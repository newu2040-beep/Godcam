name: Publish Compiled Debug APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate compiled APK and SHA-256 checksum
        id: validate_apk
        run: |
          set -euo pipefail
          APK_PATH="apk-distribution/app-debug.apk"
          SHA_PATH="apk-distribution/app-debug.apk.sha256"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Compiled APK not found at $APK_PATH"
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Compiled APK at $APK_PATH is empty"
            exit 1
          fi

          if [ ! -f "$SHA_PATH" ]; then
            echo "::error::SHA-256 checksum file not found at $SHA_PATH"
            exit 1
          fi

          EXPECTED_SHA=$(awk '{print $1}' "$SHA_PATH" | tr -d '[:space:]')
          ACTUAL_SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')

          if [ -z "$EXPECTED_SHA" ] || [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "::error::SHA-256 mismatch! Expected: $EXPECTED_SHA, Actual: $ACTUAL_SHA"
            exit 1
          fi

          unzip -tq "$APK_PATH"

          APK_BYTES=$(wc -c < "$APK_PATH" | tr -d '[:space:]')
          APK_HUMAN_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')

          echo "sha256=${ACTUAL_SHA}" >> "$GITHUB_OUTPUT"
          echo "size_bytes=${APK_BYTES}" >> "$GITHUB_OUTPUT"
          echo "size_human=${APK_HUMAN_SIZE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          APK_SHA256="${{ steps.validate_apk.outputs.sha256 }}"
          APK_SIZE_BYTES="${{ steps.validate_apk.outputs.size_bytes }}"
          APK_SIZE_HUMAN="${{ steps.validate_apk.outputs.size_human }}"
          RELEASE_PAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          DIRECT_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          RELEASE_NOTES=$(cat <<EOF
          ### Compiled Debug APK Release

          - **Commit SHA:** \`${GITHUB_SHA}\`
          - **Workflow Run Number:** \`${GITHUB_RUN_NUMBER}\` (Attempt \`${GITHUB_RUN_ATTEMPT}\`)
          - **APK File Size:** ${APK_SIZE_HUMAN} (${APK_SIZE_BYTES} bytes)
          - **SHA-256 Checksum:** \`${APK_SHA256}\`
          - **Direct Download URL:** ${DIRECT_DOWNLOAD_URL}
          EOF
          )

          gh release create "$RELEASE_TAG" \
            "apk-distribution/app-debug.apk#app-debug.apk" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

          {
            echo "## Compiled Debug APK Release Summary"
            echo ""
            echo "- **Release Tag:** \`${RELEASE_TAG}\`"
            echo "- **APK Size:** ${APK_SIZE_HUMAN} (${APK_SIZE_BYTES} bytes)"
            echo "- **SHA-256 Checksum:** \`${APK_SHA256}\`"
            echo "- **Release Page URL:** ${RELEASE_PAGE_URL}"
            echo "- **Direct Permanent Download URL:** ${DIRECT_DOWNLOAD_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
